# Config de Prometheus: scrapea el endpoint de Micrometer del app por la red interna del compose.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ledgermind
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']   # 'app' = nombre del servicio en docker-compose.observability.yml
