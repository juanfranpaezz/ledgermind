# Prometheus config: scrapes the app's Micrometer endpoint over the compose internal network.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ledgermind
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']   # 'app' = the service name in docker-compose.observability.yml
