spring:
  application:
    name: ledgermind
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgermind
    username: ledgermind
    password: ledgermind
  jpa:
    # Flyway owns the schema; Hibernate only VALIDATES that the entities match.
    hibernate:
      ddl-auto: validate
    # We avoid the Open-Session-In-View anti-pattern (it keeps the JPA session open in the web layer).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Orders UPDATEs/INSERTs by entity+id before flushing: two opposite transfers
        # (A->B and B->A) acquire the row locks in the SAME order -> reduces the 40P01 deadlock at its root.
        # (TransferService's retry covers the residual deadlock; this lowers its frequency.)
        order_updates: true
        order_inserts: true
  flyway:
    enabled: true
  mvc:
    problemdetails:
      # The errors Spring resolves on its own (@Valid validation -> MethodArgumentNotValidException, malformed JSON
      # body -> HttpMessageNotReadableException, media-type, type-mismatch) are serialized as
      # RFC 7807 ProblemDetail, JUST LIKE the domain exceptions. Without this the client's most frequent 400
      # fell into the legacy {timestamp,status,error,path} shape: two error contracts in the same API.
      enabled: true
  ai:
    mcp:
      server:
        name: ledgermind-mcp
        version: 0.0.1
        protocol: STREAMABLE   # MCP endpoint = /mcp (mcp-security does not support the deprecated SSE)
  security:
    oauth2:
      resourceserver:
        jwt:
          # Lazy: the decoder is created WITHOUT a fetch at startup; it validates against the issuer's JWKS on the 1st call to /mcp.
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/oauth2/jwks}

ledgermind:
  journal:
    signer:
      # ACTIVE signature scheme for NEW checkpoints (crypto-agility, SIGNING side). Rotating =
      # changing this value; old checkpoints are still verified with THEIR algorithm (the registry
      # dispatches by the checkpoint's algorithm field). Values: ML-DSA-65 (FIPS 204, post-quantum,
      # default) | Ed25519 (classical). A registered JournalSigner must exist for the chosen value.
      algorithm: ${LEDGERMIND_JOURNAL_SIGNER_ALGORITHM:ML-DSA-65}

management:
  endpoints:
    web:
      exposure:
        # prometheus = the endpoint Prometheus scrapes (Micrometer -> Prometheus -> Grafana) over the compose
        # internal network (app:8080), on the app's own port. Only under the demo profile is it anonymous (the bundled
        # observability stack and the Render deploy run demo), so wherever a demo app's port is published anyone can
        # read the metrics; they are not treated as sensitive. Outside demo the /api security chain also takes this
        # endpoint and asks for an X-API-Key (401 without one: ApiSecurityConfig, pinned by ActuatorExposureTest).
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ledgermind
    distribution:
      percentiles-histogram:
        # Publishes the buckets of the http.server.requests Timer -> enables p95/p99 via histogram_quantile in Grafana.
        http.server.requests: true
