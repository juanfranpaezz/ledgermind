# FULL observability stack: app + Postgres + Prometheus + Grafana, all together.
# Meant to run always-on on a VPS (or locally to take the dashboard screenshot).
#
#   docker compose -f docker-compose.observability.yml up --build -d
#
# Then:
#   - Grafana:    http://<host>:3000   (dashboard "LedgerMind — Observability" already provisioned; anonymous read-only)
#   - Prometheus: http://<host>:9090
#   - App/demo:   http://<host>:8080
#
# To generate traffic and watch the panels move, click the demo buttons on :8080 (or call /api with X-API-Key).
# The app requires LEDGERMIND_API_KEYS_FILE (fail-closed). By default observability/demo-api-keys.empty is mounted, an
# EMPTY file: only the five anonymous /api/demo/* endpoints work. To call the rest of /api with a key:
#   LEDGERMIND_API_KEYS_HOST_FILE=~/.ledgermind/api-keys.txt docker compose -f docker-compose.observability.yml up --build -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgermind
      POSTGRES_USER: ledgermind
      POSTGRES_PASSWORD: ledgermind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgermind -d ledgermind"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ledgermind-pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgermind
      SPRING_DATASOURCE_USERNAME: ledgermind
      SPRING_DATASOURCE_PASSWORD: ledgermind
      LEDGERMIND_API_KEYS_FILE: /run/ledgermind/api-keys
    volumes:
      - ${LEDGERMIND_API_KEYS_HOST_FILE:-./observability/demo-api-keys.empty}:/run/ledgermind/api-keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest   # in prod: pin a version
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest   # in prod: pin a version
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous read-only: anyone opens the dashboard without logging in (handy for showing it live).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  ledgermind-pgdata:
